<!DOCTYPE html>
<html>
<head>
<title>Titan Resume AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Titan Resume AI</h1>

<div class="container">

<h2>Upload Resume</h2>

<input type="file" id="resumeFile">
<button onclick="uploadResume()">Upload</button>

<pre id="result"></pre>

<hr>

<h2>Ask Question About Resume</h2>

<input type="text" id="question" placeholder="Ask about the resume">
<button onclick="askQuestion()">Ask</button>

<pre id="answer"></pre>

</div>

<script src="script.js"></script>

</body>
</html>
